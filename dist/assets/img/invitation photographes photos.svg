  <text x="258" y="191" font-family="system-ui,sans-serif" font-size="8.5" fill="#9ca3af">plepetit@exemple.com</text>
  <text x="258" y="202" font-family="system-ui,sans-serif" font-size="8" fill="#9ca3af">·Expire le 06/09/2026</text>
  <text x="410" y="188" font-family="system-ui,sans-serif" font-size="9.5" fill="#374151" text-anchor="middle">50 photos</text>
