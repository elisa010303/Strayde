<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 322" width="560" height="322">
  <defs>
    <clipPath id="win-clip"><rect width="560" height="322" rx="12"/></clipPath>
    <filter id="sh"><feDropShadow dx="0" dy="4" stdDeviation="12" flood-color="#00000022"/></filter>
  </defs>
  <!-- Window shadow + clip -->
  <rect width="560" height="322" rx="12" fill="white" filter="url(#sh)" clip-path="url(#win-clip)"/>
  <!-- Chrome bar -->
  <rect width="560" height="36" fill="#1e2240" rx="12 12 0 0" clip-path="url(#win-clip)"/>
  <!-- macOS dots -->
  <circle cx="18" cy="18" r="5.5" fill="#ff5f57"/>
  <circle cx="34" cy="18" r="5.5" fill="#febc2e"/>
  <circle cx="50" cy="18" r="5.5" fill="#28c840"/>
