  <text x="12" y="218" font-family="system-ui,sans-serif" font-size="9.5" fill="#374151">Quota (nombre de photos)</text>
  <rect x="12" y="222" width="218" height="22" rx="4" fill="#f9fafb" stroke="#e5e7eb" stroke-width="1"/>
  <text x="20" y="237" font-family="system-ui,sans-serif" font-size="9" fill="#d1d5db">Illimité</text>
