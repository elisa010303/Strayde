  <text x="258" y="245" font-family="system-ui,sans-serif" font-size="8.5" fill="#9ca3af">photo@exemple.com</text>
  <text x="258" y="256" font-family="system-ui,sans-serif" font-size="8" fill="#9ca3af">·Expire le 01/09/2026</text>
  <text x="410" y="242" font-family="system-ui,sans-serif" font-size="9.5" fill="#374151" text-anchor="middle">10 photos</text>
  <rect x="474" y="230" width="48" height="18" rx="9" fill="#c5d97d"/>
  <text x="498" y="242" font-family="system-ui,sans-serif" font-size="9" font-weight="600" fill="#1e2240" text-anchor="middle">Actif</text>
  <line x1="246" y1="266" x2="550" y2="266" stroke="#f3f4f6" stroke-width="0.5"/>
